server {
    listen 443 ssl;
    server_name 13-233-154-188.nip.io;

    ssl_certificate /etc/letsencrypt/live/13-233-154-188.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13-233-154-188.nip.io/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
