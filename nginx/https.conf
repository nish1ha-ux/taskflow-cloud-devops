# Redirect HTTP to HTTPS once certificates are available
server {
    listen 80;
    server_name 65-1-93-97.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name 65-1-93-97.nip.io;

    ssl_certificate /etc/letsencrypt/live/65-1-93-97.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/65-1-93-97.nip.io/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
