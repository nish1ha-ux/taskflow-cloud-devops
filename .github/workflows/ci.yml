name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt flake8 pytest
      - name: Run flake8 linting
        run: flake8 app
      - name: Run pytest
        run: pytest -q

  compose-check:
    name: Validate Compose
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate docker-compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  build-and-push:
    name: Build and Push Docker Image
    needs: compose-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow:latest
            ghcr.io/${{ github.repository_owner }}/taskflow:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Deploy via AWS Systems Manager
        run: |
          cat >/tmp/ssm-params.json <<EOF
          {"commands":["sudo -u ubuntu bash -lc \"cd /home/ubuntu/taskflow-cloud-devops && export APP_IMAGE=ghcr.io/${{ github.repository_owner }}/taskflow:${{ github.sha }} && sed -i 's/\\\\r$//' ./deploy.sh ./scripts/deploy.sh && bash ./deploy.sh\""]}
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "Deploy TaskFlow ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM command: $COMMAND_ID"

          echo "Waiting for SSM command execution..."
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 5
          done

          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "ResponseCode" \
            --output text 2>/dev/null || echo "-1")

          echo "SSM Command status: $STATUS (ResponseCode: $RESPONSE_CODE)"

          echo "--- Deployment Output ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" != "0" ]; then
            echo "::error::Deployment failed via AWS SSM (Status: $STATUS, ResponseCode: $RESPONSE_CODE)"
            echo "--- Deployment Error ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
