version: "3.8"

services:
  # -------------------------------------------------
  # 1. Flask application
  # -------------------------------------------------
  app:
    image: ${APP_IMAGE:-ghcr.io/nish1ha-ux/taskflow:latest}
    build:
      context: ./app
    container_name: taskflow_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
    networks:
      - webnet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------
  # 2. PostgreSQL (portable volume & robust healthcheck)
  # -------------------------------------------------
  postgres:
    image: postgres:16
    container_name: taskflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - webnet

  # -------------------------------------------------
  # 3. Nginx reverse-proxy
  # -------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: taskflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONF:-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - nginx-letsencrypt:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot:ro
    networks:
      - webnet
    depends_on:
      - app

  # -------------------------------------------------
  # 4. Certbot one-shot container
  # -------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: taskflow_certbot
    restart: "no"
    command: >
      certonly --webroot
      --webroot-path /var/www/certbot
      --agree-tos
      --non-interactive
      --register-unsafely-without-email
      -d 13-233-154-188.nip.io
    volumes:
      - ./nginx/www:/var/www/certbot:rw
      - nginx-letsencrypt:/etc/letsencrypt
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  postgres_data:
    name: taskflow-cloud-devops_postgres_data
  nginx-letsencrypt:
    driver: local
